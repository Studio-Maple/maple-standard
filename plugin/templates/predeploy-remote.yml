# TEMPLATE — copy to <project>/.github/workflows/predeploy-remote.yml and adapt.
# The pre-deploy gate (maple-standard D060) triggers this ONCE per deploy
# candidate sha by pushing the lightweight tag predeploy/<sha> (no workflow
# inputs: checkov CKV_GHA_7). Nothing else creates that tag namespace. Keep it to what genuinely needs a clean-room GitHub runner;
# everything else runs locally in the gate. Pin every action to a commit SHA
# (replace the placeholders) and keep the trigger to the predeploy/** tag namespace only.
name: predeploy-remote
on:
  push:
    tags:
      - "predeploy/**"
permissions:
  contents: read
concurrency:
  group: predeploy-remote-${{ github.ref }}
  cancel-in-progress: false
jobs:
  clean-room:
    # Use a self-hosted label if hosted minutes are unavailable.
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tag must name the checked-out commit
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$REF_NAME" = "predeploy/$GITHUB_SHA" ] || { echo "::error::tag $REF_NAME != predeploy/$GITHUB_SHA"; exit 1; }
      - uses: actions/checkout@<PINNED-SHA> # vX
        with:
          persist-credentials: false
      - uses: actions/setup-node@<PINNED-SHA> # vX
        with:
          node-version: 22
      - name: Clean install from the lockfile (no local state)
        run: npm ci
      - name: Registry signatures / provenance
        run: npm audit signatures
      - name: Build
        run: npm run build
