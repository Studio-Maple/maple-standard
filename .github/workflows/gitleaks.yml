name: gitleaks

# Secret scanning — catches API keys, tokens, credentials accidentally
# committed. Backup to GitHub's native Push Protection (which blocks at
# push time but only for known providers' patterns).
#
# Strategy:
#   - On PRs: scan only the diff (fast, seconds)
#   - Weekly: scan full history (catches anything that snuck in via a
#     force-push or a missed PR)
#
# To allowlist a specific finding (false positive), add a rule to
# .gitleaks.toml at the repo root. NEVER allowlist a real secret — rotate it.

on:
  pull_request:
  push:
    branches: [main, development]
  schedule:
    # Weekly deep history scan: Sunday 06:00 UTC.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so push/schedule scans cover everything;
          # PRs only need the diff.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      # Direct CLI, not gitleaks/gitleaks-action: the ACTION requires a paid
      # license key when the repo owner is a GitHub organization; the CLI
      # itself is MIT and does the same scan.
      - name: Run gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          set -u
          VERSION="8.24.3"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # Full history scan (young repo — seconds). .gitleaks.toml at the
          # repo root is picked up automatically for allowlisting.
          /tmp/gitleaks git . --redact --exit-code 1 \
            --report-format sarif --report-path results.sarif

      # Optional: push gitleaks findings to the Supabase sarif_findings
      # pipeline (same ingest function as CodeQL/Snyk). Skips without secrets.
      - name: Ingest gitleaks SARIF to observability tables (optional)
        if: always()
        continue-on-error: true
        env:
          SARIF_INGEST_TOKEN: ${{ secrets.SARIF_INGEST_TOKEN }}
          SARIF_INGEST_URL: ${{ secrets.SARIF_INGEST_URL }}
        run: |
          set -u
          if [ -z "${SARIF_INGEST_TOKEN:-}" ] || [ -z "${SARIF_INGEST_URL:-}" ]; then
            echo "::notice::SARIF_INGEST_TOKEN/URL not set — skipping ingest"
            exit 0
          fi
          SARIF_FILE="results.sarif"
          if [ ! -f "$SARIF_FILE" ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"gitleaks","rules":[]}},"results":[]}]}' > /tmp/empty.sarif
            SARIF_FILE="/tmp/empty.sarif"
            echo "No SARIF (clean run) — sending empty payload to clear stale findings"
          fi
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          jq -nc \
            --arg scanner "gitleaks" \
            --arg branch "$BRANCH" \
            --arg commit_sha "${GITHUB_SHA}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --slurpfile sarif "$SARIF_FILE" \
            '{scanner: $scanner, branch: $branch, commit_sha: $commit_sha, run_id: $run_id, sarif: $sarif[0]}' \
            > /tmp/gitleaks-payload.json
          HTTP_CODE=$(curl -sS -o /tmp/gitleaks-response.json -w '%{http_code}' \
            -X POST "$SARIF_INGEST_URL" \
            -H "Authorization: Bearer $SARIF_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/gitleaks-payload.json) || HTTP_CODE=000
          echo "Response ($HTTP_CODE): $(cat /tmp/gitleaks-response.json)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::ingest-sarif returned HTTP $HTTP_CODE for gitleaks"
          fi

      # If gitleaks itself failed (real exit code — leaks found or scanner
      # error), surface that as a workflow failure after the ingest step
      # had its chance to ship the SARIF.
      - name: Re-raise gitleaks failure
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::gitleaks found leaks or failed — see logs above"
          exit 1
