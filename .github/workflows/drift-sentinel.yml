name: Schema Drift Sentinel

# Why this workflow exists
# ------------------------
# The migrations job in supabase-migrations.yml only verifies that
# checked-in migration files apply cleanly to a fresh local Postgres — it
# never queries production. This workflow connects to the linked Supabase
# project and asserts that the PROD schema matches what the migration files
# would build. Catches "dashboard edits without a migration" drift, the
# classic Supabase failure mode.
#
# On detected drift the job fails (gating PRs) AND opens a GitHub issue
# tagged `schema-drift` so scheduled runs leave a visible trace. Clean runs
# auto-close any open drift issues.
#
# Required repo secrets (per-project setup — see README):
#   SUPABASE_PROJECT_REF   — your project ref (also settable as a variable)
#   SUPABASE_ACCESS_TOKEN  — Supabase dashboard > Account > Access Tokens
#   SUPABASE_DB_PASSWORD   — Project Settings > Database
# The job skips gracefully while these are unset (fresh clone).

on:
  push:
    branches: [main, development]
    paths:
      - "supabase/migrations/**"
  schedule:
    # Weekly drift check — Monday 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: drift-sentinel-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # for opening / closing the drift tracking issue

jobs:
  drift-sentinel:
    runs-on: ubuntu-latest
    name: Detect schema drift (linked vs migrations)
    # Dependabot PRs never change DB schema, and secrets aren't available in
    # the Dependabot context.
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip if Supabase secrets not configured
        id: check
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — skipping drift sentinel. Configure repo secrets to enable."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.skip == 'false'

      - name: Setup Supabase CLI
        if: steps.check.outputs.skip == 'false'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link to project
        if: steps.check.outputs.skip == 'false'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Detect drift
        if: steps.check.outputs.skip == 'false'
        id: diff
        run: |
          set -euo pipefail
          OUT=$(supabase db diff --linked --schema public)
          if [ -n "$OUT" ]; then
            {
              echo "drift=true"
              echo "diff<<DIFF_EOF"
              echo "$OUT"
              echo "DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error title=Schema drift detected::Linked Supabase project has objects not in checked-in migrations. Run 'supabase db diff --linked > supabase/migrations/<ts>_<desc>.sql' and commit."
            echo "----- diff output -----"
            echo "$OUT"
            echo "----- end diff -----"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift between linked project and migrations."
          fi

      - name: Open or update drift tracking issue
        if: steps.check.outputs.skip == 'false' && steps.diff.outputs.drift == 'true' && github.event_name != 'pull_request'
        env:
          DIFF_BODY: ${{ steps.diff.outputs.diff }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label schema-drift --state open --limit 1 --json number \
            --jq '.[0].number // empty')

          BODY=$(cat <<EOF
          The schema-drift sentinel detected differences between the linked Supabase
          project and the checked-in migrations on $(date -u +"%Y-%m-%d %H:%M UTC").

          Triggered by: \`${{ github.event_name }}\` on \`${{ github.ref }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Diff output

          \`\`\`sql
          ${DIFF_BODY}
          \`\`\`

          ### How to resolve

          1. \`export SUPABASE_DB_PASSWORD=...\`
          2. \`TS=\$(date -u +%Y%m%d%H%M%S)\`
          3. \`supabase db diff --linked --schema public > supabase/migrations/\${TS}_describe_change.sql\`
          4. \`supabase migration repair --status applied "\$TS" --linked\` (so prod doesn't re-apply already-existing objects)
          5. \`pnpm supabase:types\`
          6. Commit, open PR.

          This issue auto-closes on the next clean sentinel run.
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated existing drift issue #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Schema drift detected $(date -u +%Y-%m-%d)" \
              --label schema-drift \
              --body "$BODY"
          fi

      - name: Auto-close stale drift issues
        if: steps.check.outputs.skip == 'false' && steps.diff.outputs.drift == 'false' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label schema-drift --state open --json number --jq '.[].number')
          for n in $OPEN; do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "Sentinel run on $(date -u +%Y-%m-%d) found no drift. Auto-closing."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed
          done

      - name: Fail if drift detected
        if: steps.check.outputs.skip == 'false' && steps.diff.outputs.drift == 'true'
        run: exit 1
