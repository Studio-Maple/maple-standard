# Supabase local-dev configuration (partial — the CLI fills in defaults).
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# project_id is a LITERAL (not env()) so this project's local stack always
# has a unique container/network name and can never collide with another
# local project's default "supabase" stack. Rename it when instantiating
# (see README "Instantiate a new project").
project_id = "your-project-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Limits payload size for accidental or malicious requests.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]

[edge_runtime]
enabled = true

# ── Multi-project machines: give each project its own port block ─────────
# Only project_id is namespaced — the 543xx default ports above are NOT,
# and collide the moment a second local stack runs on the same machine.
# When instantiating, move the whole stack to a unique block (e.g. 563xx):
# [api].port, [db].port, [db].shadow_port, [studio].port above, PLUS the
# services below, which default into 543xx even without a section here.
#
# [analytics]
# enabled = true
# port = 54327
#
# [inbucket]
# port = 54324
